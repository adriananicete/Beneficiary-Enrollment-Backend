name: BES Backend UAT

on:
  workflow_dispatch:
  push:
    branches:
      - uat-deployed

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Run backend checks
        run: npm run verify

  runner-check:
    needs: verify
    if: github.ref == 'refs/heads/uat-deployed'
    runs-on: [self-hosted, Windows, X64, bes-backend-uat]

    steps:
      - name: Check deployment runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          whoami
          Get-Service -Name 'BES-API-UAT' |
            Select-Object Name, Status

          if (-not (Test-Path 'F:\bes_backend_uat\server.js')) {
            throw 'UAT backend server.js was not found.'
          }

          $probe = 'F:\Fixes\BES_Backend_CICD_Backups\runner-write-test.txt'
          Set-Content -Path $probe -Value 'Runner write test'
          Remove-Item -Path $probe

          Write-Host 'Runner checks passed.'
