name: BES Backend UAT

on:
  workflow_dispatch:
  push:
    branches:
      - uat-deployed

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Run backend checks
        run: npm run verify